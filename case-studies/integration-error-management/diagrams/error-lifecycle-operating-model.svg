<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Multi-provider error lifecycle and operating model</title>
  <desc id="desc">Five stages show error sources, evidence storage, two distinct mapping paths, product recovery decisions, and monitoring with escalation.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4169b1"/>
    </marker>
    <style>
      .bg{fill:#f4f6fa}.title{font:700 34px Arial,sans-serif;fill:#172033}.subtitle{font:400 18px Arial,sans-serif;fill:#5d6779}.step{font:700 15px Arial,sans-serif;fill:#4169b1;letter-spacing:1.2px}.card{fill:#fff;stroke:#dce2ec;stroke-width:2}.head{fill:#edf2ff}.head2{fill:#eef8f2}.head3{fill:#fff5e8}.head4{fill:#f4efff}.cardtitle{font:700 22px Arial,sans-serif;fill:#172033}.item{font:400 17px Arial,sans-serif;fill:#374151}.small{font:400 15px Arial,sans-serif;fill:#536071}.pill{fill:#f7f9fc;stroke:#dce2ec;stroke-width:1.5}.pilltext{font:600 15px Arial,sans-serif;fill:#273449}.arrow{stroke:#4169b1;stroke-width:4;fill:none;marker-end:url(#arrow)}.branch{stroke:#7a58b5;stroke-width:3;fill:none;marker-end:url(#arrow)}.note{fill:#172033}.notetitle{font:700 18px Arial,sans-serif;fill:#fff}.notetext{font:400 16px Arial,sans-serif;fill:#e8edf6}.label{font:700 14px Arial,sans-serif;fill:#5b4a79}.divider{stroke:#e1e6ef;stroke-width:2}.badge{fill:#fff;stroke:#c8d3e6;stroke-width:1.5}.badgetext{font:700 14px Arial,sans-serif;fill:#4169b1}
    </style>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <text class="title" x="70" y="62">Multi-Provider Error Lifecycle &amp; Operating Model</text>
  <text class="subtitle" x="70" y="94">From technical evidence to safe customer outcomes, operational recovery, and escalation</text>

  <text class="step" x="74" y="145">01 · SOURCES</text>
  <rect class="card" x="70" y="165" rx="18" width="270" height="550" filter="url(#shadow)"/>
  <rect class="head" x="71" y="166" rx="17" width="268" height="76"/>
  <rect fill="#edf2ff" x="71" y="220" width="268" height="22"/>
  <text class="cardtitle" x="96" y="212">Where it begins</text>
  <rect class="pill" x="94" y="272" rx="10" width="222" height="62"/>
  <text class="item" x="112" y="300">Provider response</text><text class="small" x="112" y="321">or provider error</text>
  <rect class="pill" x="94" y="350" rx="10" width="222" height="62"/>
  <text class="item" x="112" y="378">Normalization</text><text class="small" x="112" y="399">service failure</text>
  <rect class="pill" x="94" y="428" rx="10" width="222" height="62"/>
  <text class="item" x="112" y="456">Database or</text><text class="small" x="112" y="477">transaction-state mismatch</text>
  <rect class="pill" x="94" y="506" rx="10" width="222" height="62"/>
  <text class="item" x="112" y="534">Payment or internal</text><text class="small" x="112" y="555">orchestration failure</text>
  <rect class="pill" x="94" y="584" rx="10" width="222" height="62"/>
  <text class="item" x="112" y="612">UI validation or</text><text class="small" x="112" y="633">rendering failure</text>

  <path class="arrow" d="M340 440 H386"/>

  <text class="step" x="394" y="145">02 · EVIDENCE &amp; STATE</text>
  <rect class="card" x="390" y="165" rx="18" width="270" height="550" filter="url(#shadow)"/>
  <rect class="head2" x="391" y="166" rx="17" width="268" height="76"/>
  <rect fill="#eef8f2" x="391" y="220" width="268" height="22"/>
  <text class="cardtitle" x="416" y="212">Record safely</text>
  <text class="item" x="418" y="286">Error event</text>
  <text class="small" x="418" y="313">• Correlation reference</text>
  <text class="small" x="418" y="339">• Source and journey stage</text>
  <text class="small" x="418" y="365">• Provider alias</text>
  <text class="small" x="418" y="391">• Product category</text>
  <line class="divider" x1="416" y1="425" x2="634" y2="425"/>
  <text class="item" x="418" y="466">Transaction state</text>
  <rect class="badge" x="418" y="489" rx="15" width="92" height="34"/><text class="badgetext" x="439" y="512">PENDING</text>
  <rect class="badge" x="518" y="489" rx="15" width="102" height="34"/><text class="badgetext" x="537" y="512">UNKNOWN</text>
  <rect class="badge" x="418" y="535" rx="15" width="98" height="34"/><text class="badgetext" x="438" y="558">FAILED</text>
  <rect class="badge" x="524" y="535" rx="15" width="110" height="34"/><text class="badgetext" x="539" y="558">COMPLETED</text>
  <text class="small" x="418" y="617">Raw technical evidence stays</text>
  <text class="small" x="418" y="640">internal and access-controlled.</text>

  <path class="arrow" d="M660 440 H706"/>

  <text class="step" x="714" y="145">03 · TWO MAPPINGS</text>
  <rect class="card" x="710" y="165" rx="18" width="300" height="550" filter="url(#shadow)"/>
  <rect class="head3" x="711" y="166" rx="17" width="298" height="76"/>
  <rect fill="#fff5e8" x="711" y="220" width="298" height="22"/>
  <text class="cardtitle" x="736" y="212">Keep them separate</text>
  <rect class="pill" x="734" y="274" rx="12" width="252" height="154"/>
  <text class="label" x="752" y="304">A · DOMAIN NORMALIZATION</text>
  <text class="item" x="752" y="340">Provider response</text>
  <text class="small" x="752" y="367">→ Canonical product model</text>
  <text class="small" x="752" y="394">Gap: unsafe field or state</text>
  <rect class="pill" x="734" y="452" rx="12" width="252" height="177"/>
  <text class="label" x="752" y="482">B · ERROR CATALOGUE</text>
  <text class="item" x="752" y="518">Provider error code</text>
  <text class="small" x="752" y="545">→ Internal error category</text>
  <text class="small" x="752" y="572">→ Message and retry rule</text>
  <text class="small" x="752" y="599">Gap: missing or wrong match</text>

  <path class="arrow" d="M1010 440 H1056"/>

  <text class="step" x="1064" y="145">04 · PRODUCT DECISION</text>
  <rect class="card" x="1060" y="165" rx="18" width="250" height="550" filter="url(#shadow)"/>
  <rect class="head4" x="1061" y="166" rx="17" width="248" height="76"/>
  <rect fill="#f4efff" x="1061" y="220" width="248" height="22"/>
  <text class="cardtitle" x="1086" y="212">Recovery policy</text>
  <text class="item" x="1088" y="286">Customer message</text>
  <text class="item" x="1088" y="331">Safe continuation</text>
  <text class="item" x="1088" y="376">Customer correction</text>
  <text class="item" x="1088" y="421">Bounded safe retry</text>
  <text class="item" x="1088" y="466">Reconciliation</text>
  <text class="item" x="1088" y="511">Operational follow-up</text>
  <text class="item" x="1088" y="556">Final failure</text>
  <line class="divider" x1="1086" y1="592" x2="1284" y2="592"/>
  <text class="small" x="1088" y="625">UI receives an actionable</text>
  <text class="small" x="1088" y="648">product state, not a raw error.</text>

  <path class="arrow" d="M1310 440 H1356"/>

  <text class="step" x="1364" y="145">05 · RESPONSE</text>
  <rect class="card" x="1360" y="165" rx="18" width="180" height="550" filter="url(#shadow)"/>
  <rect class="head" x="1361" y="166" rx="17" width="178" height="76"/>
  <rect fill="#edf2ff" x="1361" y="220" width="178" height="22"/>
  <text class="cardtitle" x="1382" y="212">Act on impact</text>
  <text class="item" x="1384" y="291">Monitor trend</text>
  <text class="item" x="1384" y="343">Create flag</text>
  <text class="item" x="1384" y="395">Operational triage</text>
  <text class="item" x="1384" y="447">Contain &amp; recover</text>
  <text class="item" x="1384" y="499">Contact decision</text>
  <text class="item" x="1384" y="551">Critical alert</text>
  <text class="item" x="1384" y="603">Stakeholder</text>
  <text class="small" x="1384" y="626">escalation</text>

  <rect class="note" x="70" y="780" rx="18" width="1470" height="132"/>
  <text class="notetitle" x="98" y="822">Severity is determined by impact, not by component name alone.</text>
  <text class="notetext" x="98" y="856">Error rate, affected volume, transaction uncertainty, financial exposure, customer impact, and trend determine whether the signal is monitored,</text>
  <text class="notetext" x="98" y="883">assigned for operational recovery, or escalated as a critical incident.</text>
</svg>
